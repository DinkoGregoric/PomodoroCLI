name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            artifact: pomodoro-win-x64.exe
          - rid: linux-x64
            os: ubuntu-latest
            artifact: pomodoro-linux-x64
          - rid: osx-x64
            os: macos-latest
            artifact: pomodoro-osx-x64
          - rid: osx-arm64
            os: macos-latest
            artifact: pomodoro-osx-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        shell: bash
        run: |
          dotnet publish Pomodoro.CLI/Pomodoro.CLI.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=none \
            -o ./publish

      - name: Rename artifact (Windows)
        if: matrix.rid == 'win-x64'
        run: mv ./publish/pomodoro.exe ./publish/${{ matrix.artifact }}

      - name: Rename artifact (non-Windows)
        if: matrix.rid != 'win-x64'
        run: mv ./publish/pomodoro ./publish/${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
